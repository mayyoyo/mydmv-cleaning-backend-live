<!-- ============================================================
     CONTRACT + SIGNATURE JAVASCRIPT
============================================================ -->

<script>


/* ============================================================
   GLOBAL VARIABLES
============================================================ */

var canvas = null;

var ctx = null;

var drawing = false;



/* ============================================================
   PAGE LOAD
============================================================ */

document.addEventListener(
    "DOMContentLoaded",
    function () {

        canvas =
            document.getElementById("canvas");


        if (!canvas) {

            console.error(
                "Signature canvas not found."
            );

            return;

        }


        ctx =
            canvas.getContext("2d");


        if (!ctx) {

            console.error(
                "Could not create canvas context."
            );

            return;

        }


        ctx.lineWidth = 2;

        ctx.lineCap = "round";

        ctx.lineJoin = "round";

        ctx.strokeStyle = "#000000";


        setupSignature();

        setupContractType();

        updateContractSections();

    }
);



/* ============================================================
   GET CANVAS POSITION
============================================================ */

function getPosition(event) {

    var rect =
        canvas.getBoundingClientRect();


    var clientX;

    var clientY;


    if (
        event.touches &&
        event.touches.length > 0
    ) {

        clientX =
            event.touches[0].clientX;

        clientY =
            event.touches[0].clientY;

    }

    else {

        clientX =
            event.clientX;

        clientY =
            event.clientY;

    }


    return {

        x:
            (clientX - rect.left)
            *
            (canvas.width / rect.width),

        y:
            (clientY - rect.top)
            *
            (canvas.height / rect.height)

    };

}



/* ============================================================
   START DRAWING
============================================================ */

function startDrawing(event) {

    event.preventDefault();


    drawing = true;


    var position =
        getPosition(event);


    ctx.beginPath();


    ctx.moveTo(
        position.x,
        position.y
    );

}



/* ============================================================
   DRAW
============================================================ */

function draw(event) {

    if (!drawing) {

        return;

    }


    event.preventDefault();


    var position =
        getPosition(event);


    ctx.lineTo(
        position.x,
        position.y
    );


    ctx.stroke();

}



/* ============================================================
   STOP DRAWING
============================================================ */

function stopDrawing(event) {

    if (event) {

        event.preventDefault();

    }


    drawing = false;


    if (ctx) {

        ctx.beginPath();

    }

}



/* ============================================================
   SIGNATURE SETUP
============================================================ */

function setupSignature() {


    /* --------------------------------------------------------
       MOUSE
    -------------------------------------------------------- */

    canvas.addEventListener(
        "mousedown",
        startDrawing
    );


    canvas.addEventListener(
        "mousemove",
        draw
    );


    canvas.addEventListener(
        "mouseup",
        stopDrawing
    );


    canvas.addEventListener(
        "mouseleave",
        stopDrawing
    );



    /* --------------------------------------------------------
       TOUCH
    -------------------------------------------------------- */

    canvas.addEventListener(
        "touchstart",
        startDrawing,
        {
            passive:false
        }
    );


    canvas.addEventListener(
        "touchmove",
        draw,
        {
            passive:false
        }
    );


    canvas.addEventListener(
        "touchend",
        stopDrawing,
        {
            passive:false
        }
    );


    canvas.addEventListener(
        "touchcancel",
        stopDrawing,
        {
            passive:false
        }
    );

}



/* ============================================================
   CLEAR CANVAS
============================================================ */

function clearCanvas() {

    if (!canvas || !ctx) {

        return;

    }


    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

}



/* ============================================================
   CHECK SIGNATURE
============================================================ */

function hasSignature() {

    if (!canvas) {

        return false;

    }


    var blankCanvas =
        document.createElement(
            "canvas"
        );


    blankCanvas.width =
        canvas.width;


    blankCanvas.height =
        canvas.height;


    return (
        canvas.toDataURL("image/png") !==
        blankCanvas.toDataURL("image/png")
    );

}



/* ============================================================
   CONTRACT TYPE
============================================================ */

function setupContractType() {

    var contractType =
        document.getElementById(
            "contractType"
        );


    if (!contractType) {

        return;

    }


    contractType.addEventListener(
        "change",
        updateContractSections
    );

}



/* ============================================================
   UPDATE CONTRACT SECTIONS
============================================================ */

function updateContractSections() {

    var contractType =
        document.getElementById(
            "contractType"
        );


    var contractorSection =
        document.getElementById(
            "contractorSection"
        );


    var clientSection =
        document.getElementById(
            "clientSection"
        );


    var jobCompletionSection =
        document.getElementById(
            "jobCompletionSection"
        );


    var documentDescription =
        document.getElementById(
            "documentDescription"
        );


    if (
        !contractType ||
        !contractorSection ||
        !clientSection ||
        !jobCompletionSection ||
        !documentDescription
    ) {

        return;

    }


    contractorSection.style.display =
        "none";


    clientSection.style.display =
        "none";


    jobCompletionSection.style.display =
        "none";



    /* ========================================================
       INDEPENDENT CONTRACTOR
    ======================================================== */

    if (
        contractType.value ===
        "Independent Contractor Agreement"
    ) {

        contractorSection.style.display =
            "block";


        documentDescription.innerHTML =
            "<strong>" +
            "Independent Contractor Agreement" +
            "</strong>" +
            "<br><br>" +
            "Please provide your contractor information " +
            "before signing this document.";

    }



    /* ========================================================
       CLIENT SERVICE
    ======================================================== */

    else if (
        contractType.value ===
        "Client Service Agreement"
    ) {

        clientSection.style.display =
            "block";


        documentDescription.innerHTML =
            "<strong>" +
            "Client Service Agreement" +
            "</strong>" +
            "<br><br>" +
            "Please provide the service information " +
            "before signing this document.";

    }



    /* ========================================================
       NON-BINDING
    ======================================================== */

    else if (
        contractType.value ===
        "Non-Binding Agreement"
    ) {

        documentDescription.innerHTML =
            "<strong>" +
            "Non-Binding Agreement" +
            "</strong>" +
            "<br><br>" +
            "This document records the parties' " +
            "understanding without creating a " +
            "binding contractual obligation.";

    }



    /* ========================================================
       JOB COMPLETION
    ======================================================== */

    else if (
        contractType.value ===
        "Job Completion Form"
    ) {

        jobCompletionSection.style.display =
            "block";


        documentDescription.innerHTML =
            "<strong>" +
            "Job Completion Form" +
            "</strong>" +
            "<br><br>" +
            "Please provide information about " +
            "the cleaning work that was completed.";

    }

}



/* ============================================================
   SUBMIT CONTRACT
============================================================ */

async function submitContract() {

    var msg =
        document.getElementById("msg");


    var submitButton =
        document.getElementById(
            "submitButton"
        );



    /* ========================================================
       BASIC INFORMATION
    ======================================================== */

    var name =
        document
            .getElementById("name")
            .value
            .trim();


    var businessName =
        document
            .getElementById("businessName")
            .value
            .trim();


    var email =
        document
            .getElementById("email")
            .value
            .trim();


    var phone =
        document
            .getElementById("phone")
            .value
            .trim();



    /* ========================================================
       CONTRACT INFORMATION
    ======================================================== */

    var contractType =
        document
            .getElementById("contractType")
            .value;


    var typedName =
        document
            .getElementById("typedName")
            .value
            .trim();



    /* ========================================================
       REQUIRED FIELD VALIDATION
    ======================================================== */

    if (
        !name ||
        !email ||
        !typedName
    ) {

        msg.innerHTML =
            "⚠️ Please complete all required fields.";

        msg.style.color =
            "#ef4444";

        return;

    }



    /* ========================================================
       EMAIL VALIDATION
    ======================================================== */

    var emailPattern =
        /^[^\s@]+@[^\s@]+\.[^\s@]+$/;


    if (
        !emailPattern.test(email)
    ) {

        msg.innerHTML =
            "⚠️ Please enter a valid email address.";

        msg.style.color =
            "#ef4444";

        return;

    }



    /* ========================================================
       SIGNATURE VALIDATION
    ======================================================== */

    if (!hasSignature()) {

        msg.innerHTML =
            "⚠️ Please draw your signature before submitting.";

        msg.style.color =
            "#ef4444";

        return;

    }



    /* ========================================================
       SIGNATURE IMAGE
    ======================================================== */

    var signature =
        canvas.toDataURL(
            "image/png"
        );



    /* ========================================================
       CONTRACTOR INFORMATION
    ======================================================== */

    var experienceElement =
        document.getElementById(
            "experience"
        );


    var servicesElement =
        document.getElementById(
            "services"
        );


    var availabilityElement =
        document.getElementById(
            "availability"
        );


    var licenseElement =
        document.getElementById(
            "license"
        );


    var insuranceElement =
        document.getElementById(
            "insurance"
        );


    var experience = "";

    var services = [];

    var availability = "";

    var license = "";

    var insurance = "";


    if (experienceElement) {

        experience =
            experienceElement.value.trim();

    }


    if (servicesElement) {

        services =
            Array.from(
                servicesElement.selectedOptions
            ).map(
                function (option) {

                    return option.value;

                }
            );

    }


    if (availabilityElement) {

        availability =
            availabilityElement.value.trim();

    }


    if (licenseElement) {

        license =
            licenseElement.value.trim();

    }


    if (insuranceElement) {

        insurance =
            insuranceElement.value.trim();

    }



    /* ========================================================
       CLIENT INFORMATION
    ======================================================== */

    var addressElement =
        document.getElementById(
            "address"
        );


    var serviceDescriptionElement =
        document.getElementById(
            "serviceDescription"
        );


    var address = "";

    var serviceDescription = "";


    if (addressElement) {

        address =
            addressElement.value.trim();

    }


    if (serviceDescriptionElement) {

        serviceDescription =
            serviceDescriptionElement.value.trim();

    }



    /* ========================================================
       JOB COMPLETION INFORMATION
    ======================================================== */

    var jobDescriptionElement =
        document.getElementById(
            "jobDescription"
        );


    var completionNotesElement =
        document.getElementById(
            "completionNotes"
        );


    var jobDescription = "";

    var completionNotes = "";


    if (jobDescriptionElement) {

        jobDescription =
            jobDescriptionElement.value.trim();

    }


    if (completionNotesElement) {

        completionNotes =
            completionNotesElement.value.trim();

    }



    /* ========================================================
       DATA TO SEND
    ======================================================== */

    var data = {

        name: name,

        businessName: businessName,

        email: email,

        phone: phone,

        contractType: contractType,

        experience: experience,

        services: services,

        availability: availability,

        license: license,

        insurance: insurance,

        address: address,

        serviceDescription:
            serviceDescription,

        jobDescription:
            jobDescription,

        completionNotes:
            completionNotes,

        typedName: typedName,

        signature: signature

    };



    /* ========================================================
       SUBMITTING MESSAGE
    ======================================================== */

    msg.innerHTML =
        "⏳ Submitting your signed document...";

    msg.style.color =
        "#38bdf8";


    if (submitButton) {

        submitButton.disabled =
            true;

        submitButton.innerHTML =
            "⏳ Submitting...";

    }



    /* ========================================================
       SEND DATA TO SERVER

       LOCAL:
       http://localhost:5000

       PRODUCTION:
       https://mydmv-cleaning-backend-live.onrender.com

       MATCHES SERVER:

       app.post("/api/contracts", ...)
    ======================================================== */

    try {

        const API =
            (
                window.location.hostname === "localhost" ||
                window.location.hostname === "127.0.0.1"
            )
                ? "http://localhost:5000"
                : "https://mydmv-cleaning-backend-live.onrender.com";


        var response =
            await fetch(
                API + "/api/contracts",
                {

                    method:
                        "POST",

                    headers: {

                        "Content-Type":
                            "application/json"

                    },

                    body:
                        JSON.stringify(data)

                }
            );



        /* ====================================================
           SERVER RESPONSE
        ==================================================== */

        var result =
            await response.json();



        /* ====================================================
           SERVER ERROR
        ==================================================== */

        if (!response.ok) {

            throw new Error(
                result.message ||
                result.error ||
                "Failed to submit contract."
            );

        }



        /* ====================================================
           SUCCESS
        ==================================================== */

        msg.innerHTML =
            "✅ Document signed and submitted successfully." +
            "<br><br>" +
            "Your signed document has been saved.";

        msg.style.color =
            "#22c55e";



        /* ====================================================
           VIEW SIGNED DOCUMENT
        ==================================================== */

        if (result.file) {

            const pdfURL =
                result.file.startsWith("http")
                    ? result.file
                    : API + result.file;


            msg.innerHTML +=
                "<br><br>" +

                "<a " +
                "href=\"" +
                pdfURL +
                "\" " +
                "target=\"_blank\" " +
                "rel=\"noopener noreferrer\" " +
                "style=\"" +
                "display:inline-block;" +
                "padding:10px 16px;" +
                "border-radius:8px;" +
                "text-decoration:none;" +
                "\"" +
                ">" +

                "📄 View Signed Document" +

                "</a>";

        }



        /* ====================================================
           CLEAR FORM
        ==================================================== */

        document
            .getElementById("name")
            .value = "";


        document
            .getElementById("businessName")
            .value = "";


        document
            .getElementById("email")
            .value = "";


        document
            .getElementById("phone")
            .value = "";


        document
            .getElementById("typedName")
            .value = "";


        clearCanvas();



    } catch (error) {

        console.error(
            "Contract submission error:",
            error
        );


        msg.innerHTML =
            "❌ " +
            (
                error.message ||
                "Unable to submit the document. Please try again."
            );


        msg.style.color =
            "#ef4444";



    } finally {

        if (submitButton) {

            submitButton.disabled =
                false;

            submitButton.innerHTML =
                "✅ Sign & Submit";

        }

    }

}


</script>
