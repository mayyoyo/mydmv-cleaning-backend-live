<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>
Contact Us | My DMV Cleaning Services LLC
</title>

<!-- <link rel="stylesheet" href="./css/style.css"> -->
<link rel="stylesheet" href="./css/contract.css">

</head>


<body>


<div class="container">


<h1>
📞 Contact My DMV Cleaning Services LLC
</h1>


<p>
Have questions? Send us a message and we will get back to you.
</p>





<form id="contactForm">


<label>
Name
</label>


<input
type="text"
id="name"
required
placeholder="Your name">






<label>
Email
</label>


<input
type="email"
id="email"
required
placeholder="Your email">






<label>
Phone
</label>


<input
type="text"
id="phone"
placeholder="Your phone number">






<label>
Message
</label>



<textarea
id="message"
rows="5"
required
placeholder="Write your message">
</textarea>






<button type="submit">

📩 Send Message

</button>



<p id="result"></p>



</form>



</div>








<script>


// ================= API =================


const API =
(
window.location.hostname === "localhost" ||
window.location.hostname === "127.0.0.1"
)
?
"http://localhost:5000"
:
"https://dmv-cleaning-backend.onrender.com";








// ================= CONTACT FORM =================


document
.getElementById("contactForm")
.addEventListener(
"submit",
async function(e){


e.preventDefault();




const result =
document.getElementById("result");





const data = {


name:
document.getElementById("name")
.value
.trim(),



email:
document.getElementById("email")
.value
.trim(),



phone:
document.getElementById("phone")
.value
.trim(),



message:
document.getElementById("message")
.value
.trim()



};






// ================= VALIDATION =================


if(

!data.name ||

!data.email ||

!data.email.includes("@") ||

!data.message

){


result.innerHTML =
"❌ Please enter a valid name, email, and message.";


return;


}






result.innerHTML =
"⏳ Sending message...";







try{



const res =
await fetch(

`${API}/api/contact`,

{


method:"POST",



headers:{


"Content-Type":"application/json"


},



body:

JSON.stringify(data)



}

);







// ================= SAFE JSON RESPONSE =================


let response;


try{


response =
await res.json();


}


catch(error){


throw new Error(
"Invalid server response"
);


}








console.log(
"STATUS:",
res.status
);



console.log(
"RESPONSE:",
response
);









if(

res.ok &&

response.success

){



result.innerHTML =

"✅ Message sent successfully! We will contact you soon.";




document
.getElementById("contactForm")
.reset();




}

else{



result.innerHTML =

"❌ " +

(
response.error ||

"Message failed"

);



}





}

catch(error){



console.error(

"CONTACT ERROR:",

error

);




result.innerHTML =

"❌ Server connection failed. Try again.";





}



});



</script>



</body>

</html>
