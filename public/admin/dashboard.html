window.location.href="login.html";

</head>


<body>

<!-- CARDS -->

<!-- BOOKINGS -->

<h2>

</h2>


<table>


<thead>

<tr>

<th>Name</th>

<th>Email</th>

<th>Phone</th>

<td colspan="10">

<!-- CONTRACTS -->


<section id="documents-section">


<h2>
📄 Signed Contracts
</h2>

id="searchContracts"

placeholder="Search contracts..."

onkeyup="filterContracts()"

>

📥 Download All PDFs

</button>




<table>


<thead>


<tr>


<th>Name</th>

<th>Email</th>

<th>Type</th>

</tr>


</thead>

<script>


// ================= API =================


const API =

window.location.hostname === "localhost"

?

"http://localhost:5000"

:

"https://dmv-cleaning-backend.onrender.com";



let allContracts=[];





// ================= LOGOUT =================


function logout(){

localStorage.removeItem(
"adminToken"
);

window.location.href="login.html";

}





// ================= AUTH FETCH =================


async function fetchWithAuth(
url,
options={}
){


const token =
localStorage.getItem(
"adminToken"
);



const response =
await fetch(
url,
{

...options,

headers:{

"Content-Type":
"application/json",

"Authorization":
"Bearer " + token

}

}

);



if(response.status===401){

logout();

return null;

}



return await response.json();


}









// ================= STATUS BADGE =================


function statusBadge(status){


if(status==="deposit-paid" || status==="paid"){

return `
<span class="badge paid">
🟢 Paid
</span>
`;

}


if(status==="cancelled"){

return `
<span class="badge cancelled">
🔴 Cancelled
</span>
`;

}



return `
<span class="badge pending">
🟠 Pending
</span>
`;

}




// ================= LOAD BOOKINGS =================


async function loadBookings(){


const bookings =

await fetchWithAuth(
API+"/api/admin/bookings"
);



if(!bookings)
return;



document.getElementById("total").innerText =
bookings.length;



document.getElementById("paid").innerText =

bookings.filter(
b =>
b.status==="paid" ||
b.status==="deposit-paid"

).length;



document.getElementById("pending").innerText =

bookings.filter(
b =>
b.status==="pending"

).length;



document.getElementById("cancelled").innerText =

bookings.filter(
b =>
b.status==="cancelled"

).length;





const table =
document.getElementById(
"table-body"
);



table.innerHTML="";




bookings.forEach(b=>{


table.innerHTML += `

<tr>

<td>${b.name || "-"}</td>

<td>${b.email || "-"}</td>

<td>${b.phone || "-"}</td>

<td>${b.service || "-"}</td>

<td>${b.date || "-"}</td>

<td>${b.timeSlot || "-"}</td>

<td>$${b.price || 0}</td>

<td>$${b.deposit || 0}</td>


<td>

${statusBadge(b.status)}

</td>


<td>


<button onclick="changeStatus(${b.id},'paid')">

✅

</button>


<button onclick="changeStatus(${b.id},'pending')">

⏳

</button>


<button onclick="changeStatus(${b.id},'cancelled')">

❌

</button>


<button onclick="deleteBooking(${b.id})">

🗑

</button>


</td>


</tr>

`;


});


}







// ================= CHANGE STATUS =================


async function changeStatus(id,status){


await fetchWithAuth(

API+"/api/admin/bookings/"+id,

{

method:"PUT",

body:JSON.stringify({

status

})

}

);



loadBookings();


}







// ================= DELETE BOOKING =================


async function deleteBooking(id){


if(!confirm(
"Delete booking?"
))
return;



await fetchWithAuth(

API+"/api/admin/bookings/"+id,

{

method:"DELETE"

}

);



loadBookings();


}







// ================= CONTRACTS =================


async function loadContracts(){


const contracts =

await fetchWithAuth(
API+"/api/admin/contracts"
);



if(!contracts)
return;



allContracts=contracts;



renderContracts(
contracts
);


}






function renderContracts(data){


const table =
document.getElementById(
"contracts-body"
);



table.innerHTML="";



if(data.length===0){


table.innerHTML=

`
<tr>

<td colspan="6">
No contracts found
</td>

</tr>
`;

return;

}





data.forEach(c=>{


table.innerHTML += `


<tr>


<td>${c.name}</td>


<td>${c.email}</td>


<td>${c.contractType || "-"}</td>


<td>${new Date(c.createdAt).toLocaleDateString()}</td>



<td>


<a href="${API+c.pdfUrl}" target="_blank">

📄 View PDF

</a>


</td>




<td>


<button onclick="deleteContract(${c.id})">

🗑

</button>


</td>


</tr>


`;


});


}







function filterContracts(){


const value =

document.getElementById(
"searchContracts"
).value.toLowerCase();



renderContracts(

allContracts.filter(c=>

(c.name||"")
.toLowerCase()
.includes(value)

||

(c.email||"")
.toLowerCase()
.includes(value)

)

);


}







async function deleteContract(id){


if(!confirm(
"Delete contract?"
))
return;



await fetchWithAuth(

API+"/api/admin/contracts/"+id,

{

method:"DELETE"

}

);



loadContracts();


}






function downloadAllPDFs(){


allContracts.forEach(c=>{


if(c.pdfUrl){


window.open(
API+c.pdfUrl,
"_blank"
);


}


});


}






// ================= START =================


loadBookings();

loadContracts();


</script>

<script src="/js/site-navigation.js"></script>
</body>

</html>
