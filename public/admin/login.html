<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>
Admin Login | My DMV Cleaning Services
</title>


<link rel="stylesheet" href="../css/admin-login.css">


</head>


<body>



<div class="login-wrapper">


<div class="login-box">


<h2>
🧼 Admin Login
</h2>



<form id="loginForm">


<input

id="username"

placeholder="Username"

autocomplete="username"

required

>




<input

id="password"

type="password"

placeholder="Password"

autocomplete="current-password"

required

>



<button type="submit">

Login

</button>



</form>



<p id="msg"></p>



</div>


</div>





<script>


const API =

window.location.hostname === "localhost"

?

"http://localhost:5000"

:

"https://mydmv-cleaning-backend-live.onrender.com";





document

.getElementById("loginForm")

.addEventListener(

"submit",

async(e)=>{


e.preventDefault();




const username =

document

.getElementById("username")

.value.trim();



const password =

document

.getElementById("password")

.value.trim();



const msg =

document.getElementById("msg");




msg.innerHTML =
"Logging in...";



try{


const res =

await fetch(

`${API}/api/admin/login`,

{

method:"POST",

headers:{

"Content-Type":

"application/json"

},

body:JSON.stringify({

username,

password

})

}

);



const data =
await res.json();





if(

data.success

){


localStorage.setItem(

"adminToken",

data.token

);



msg.innerHTML =
"✅ Login successful";



setTimeout(()=>{


window.location.href =
"dashboard.html";


},700);



}

else{


msg.innerHTML =
"❌ Invalid login";


}



}

catch(error){


console.log(error);


msg.innerHTML =
"❌ Server connection failed";


}



}


);



</script>



</body>

</html>
