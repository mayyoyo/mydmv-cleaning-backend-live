<script>


// ============================================================
// PRODUCTION BACKEND
// ============================================================

const API =
    "https://mydmv-cleaning-backend-live.onrender.com";


// ============================================================
// SELECTED DATE
// ============================================================

let selectedDate = null;


// ============================================================
// ELEMENT REFERENCES
// ============================================================

const nameInput =
    document.getElementById("name");

const phoneInput =
    document.getElementById("phone");

const emailInput =
    document.getElementById("email");

const addressInput =
    document.getElementById("address");

const serviceInput =
    document.getElementById("service");

const timeInput =
    document.getElementById("timeSlot");

const messageElement =
    document.getElementById("msg");


// ============================================================
// HAMBURGER MENU
// ============================================================

function toggleMenu() {

    const nav =
        document.getElementById("navLinks");

    if (nav) {

        nav.classList.toggle("active");

    }

}


// ============================================================
// CALENDAR
// ============================================================

document.addEventListener(
    "DOMContentLoaded",
    () => {

        const calendarElement =
            document.getElementById("calendar");


        if (!calendarElement) {

            console.error(
                "Calendar element not found."
            );

            return;

        }


        const calendar =
            new FullCalendar.Calendar(
                calendarElement,
                {

                    initialView:
                        "dayGridMonth",

                    dateClick:
                        async function(info) {

                            selectedDate =
                                info.dateStr;


                            const selectedDateElement =
                                document.getElementById(
                                    "selectedDate"
                                );


                            if (
                                selectedDateElement
                            ) {

                                selectedDateElement.innerText =
                                    "Selected Date: " +
                                    selectedDate;

                            }


                            await loadBookedSlots(
                                selectedDate
                            );

                        }

                }
            );


        calendar.render();

    }
);


// ============================================================
// LOAD BOOKED TIME SLOTS
// ============================================================

async function loadBookedSlots(
    date
) {

    try {

        const response =
            await fetch(
                `${API}/api/bookings-by-date/${encodeURIComponent(date)}`
            );


        if (!response.ok) {

            throw new Error(
                "Could not load booked times."
            );

        }


        const booked =
            await response.json();


        const select =
            document.getElementById(
                "timeSlot"
            );


        if (!select) {

            return;

        }


        // Reset all time options

        Array.from(
            select.options
        ).forEach(
            option => {

                if (option.value) {

                    option.disabled =
                        false;

                    option.textContent =
                        option.value;

                }

            }
        );


        // Disable booked times

        if (Array.isArray(booked)) {

            booked.forEach(
                slot => {

                    const option =
                        Array.from(
                            select.options
                        ).find(
                            option =>
                                option.value ===
                                slot
                        );


                    if (option) {

                        option.disabled =
                            true;

                        option.textContent =
                            slot +
                            " ❌ Booked";

                    }

                }
            );

        }


    }

    catch (error) {

        console.error(
            "LOAD BOOKED SLOTS ERROR:",
            error
        );

    }

}


// ============================================================
// UPDATE PRICE
// ============================================================

function updatePrice() {

    const price =
        Number(
            serviceInput
                ? serviceInput.value
                : 0
        ) || 0;


    const deposit =
        Math.round(
            price * 0.25 * 100
        ) / 100;


    const remaining =
        Math.round(
            (price - deposit) * 100
        ) / 100;


    const totalElement =
        document.getElementById(
            "total"
        );


    const depositElement =
        document.getElementById(
            "deposit"
        );


    const remainingElement =
        document.getElementById(
            "remaining"
        );


    if (totalElement) {

        totalElement.innerText =
            `$${price.toFixed(2)}`;

    }


    if (depositElement) {

        depositElement.innerText =
            `$${deposit.toFixed(2)}`;

    }


    if (remainingElement) {

        remainingElement.innerText =
            `$${remaining.toFixed(2)}`;

    }

}


// ============================================================
// COLLECT FORM
// ============================================================

function collectForm() {


    // --------------------------------------------------------
    // DATE
    // --------------------------------------------------------

    if (!selectedDate) {

        throw new Error(
            "Please select a date."
        );

    }


    // --------------------------------------------------------
    // SERVICE
    // --------------------------------------------------------

    const serviceElement =
        document.getElementById(
            "service"
        );


    if (
        !serviceElement ||
        !serviceElement.value
    ) {

        throw new Error(
            "Please select a cleaning service."
        );

    }


    // --------------------------------------------------------
    // TIME
    // --------------------------------------------------------

    const timeElement =
        document.getElementById(
            "timeSlot"
        );


    if (
        !timeElement ||
        !timeElement.value
    ) {

        throw new Error(
            "Please select a time."
        );

    }


    // --------------------------------------------------------
    // SAFELY READ TEXT VALUES
    // --------------------------------------------------------

    const name =
        String(
            nameInput?.value || ""
        ).trim();


    const phone =
        String(
            phoneInput?.value || ""
        ).trim();


    const email =
        String(
            emailInput?.value || ""
        ).trim();


    const address =
        String(
            addressInput?.value || ""
        ).trim();


    // --------------------------------------------------------
    // VALIDATION
    // --------------------------------------------------------

    if (!name) {

        throw new Error(
            "Please enter your full name."
        );

    }


    if (!phone) {

        throw new Error(
            "Please enter your phone number."
        );

    }


    if (!email) {

        throw new Error(
            "Please enter your email."
        );

    }


    if (!address) {

        throw new Error(
            "Please enter your address."
        );

    }


    // --------------------------------------------------------
    // EMAIL BASIC VALIDATION
    // --------------------------------------------------------

    if (
        !email.includes("@")
    ) {

        throw new Error(
            "Please enter a valid email address."
        );

    }


    // --------------------------------------------------------
    // SERVICE DATA
    // --------------------------------------------------------

    const price =
        Number(
            serviceElement.value
        );


    if (
        !Number.isFinite(price) ||
        price <= 0
    ) {

        throw new Error(
            "Please select a valid cleaning service."
        );

    }


    const service =
        serviceElement.options[
            serviceElement.selectedIndex
        ].text;


    const timeSlot =
        timeElement.value;


    // --------------------------------------------------------
    // FINAL DATA
    // --------------------------------------------------------

    return {

        name,

        phone,

        email,

        address,

        service,

        price,

        date:
            selectedDate,

        timeSlot

    };

}


// ============================================================
// PAY NOW — 25% STRIPE DEPOSIT
// ============================================================

async function payNow() {

    try {


        const data =
            collectForm();


        messageElement.innerText =
            "⏳ Creating your secure payment...";


        const response =
            await fetch(
                `${API}/api/create-deposit-checkout`,
                {

                    method:
                        "POST",

                    headers: {

                        "Content-Type":
                            "application/json"

                    },

                    body:
                        JSON.stringify(data)

                }
            );


        const result =
            await response.json();


        if (!response.ok) {

            throw new Error(
                result.error ||
                "Unable to create payment."
            );

        }


        if (!result.url) {

            throw new Error(
                "Stripe payment URL was not returned."
            );

        }


        // Redirect to Stripe

        window.location.href =
            result.url;


    }

    catch (error) {

        console.error(
            "PAY NOW ERROR:",
            error
        );


        messageElement.innerText =
            "";


        alert(
            error.message ||
            "Payment could not be started."
        );

    }

}


// ============================================================
// PAY LATER
// ============================================================

async function payLater() {

    try {


        const data =
            collectForm();


        messageElement.innerText =
            "⏳ Saving your booking...";


        const response =
            await fetch(
                `${API}/api/book-pay-later`,
                {

                    method:
                        "POST",

                    headers: {

                        "Content-Type":
                            "application/json"

                    },

                    body:
                        JSON.stringify(data)

                }
            );


        const result =
            await response.json();


        if (!response.ok) {

            throw new Error(
                result.error ||
                "Booking could not be saved."
            );

        }


        if (
            !result.bookingId
        ) {

            throw new Error(
                "Booking ID was not returned from the server."
            );

        }


        // ----------------------------------------------------
        // PAY LATER SUCCESS PAGE
        // ----------------------------------------------------

        window.location.href =
            `success.html?booking_id=${encodeURIComponent(
                result.bookingId
            )}`;


    }

    catch (error) {

        console.error(
            "PAY LATER ERROR:",
            error
        );


        messageElement.innerText =
            "";


        alert(
            error.message ||
            "Booking could not be saved."
        );

    }

}

</script>
